name: test

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Original serial ordering is a daily backstop for cross-group dependencies.
    - cron: '23 8 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Serial backstop or repeatable exact-head sharded benchmark
        type: choice
        options: [serial, sharded]
        default: serial

permissions:
  contents: read
  issues: write

concurrency:
  group: test-${{ github.event_name }}-${{ github.ref }}-${{ inputs.suite }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  SOLANA_VERSION: '4.0.1'

jobs:
  quick:
    name: quick tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Run quick tests (no database or validator)
        run: node scripts/ci/run-quick-tests.mjs

  neuron-publishing:
    name: neuron publishing release gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: repoing_neurons_release_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Require publishing database, security and compatibility checks
        run: npm run test:neurons:release
        env:
          NEURONS_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55432/repoing_neurons_release_test
          NEURONS_PUBLISHING_ENABLED: 'false'
          HOOK_WALLET_IDENTITY_ENABLED: 'false'
      - name: Audit production and development dependencies
        run: npm audit

  integration:
    name: integration (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Each matrix job owns its PostgreSQL, ledgers, ports and filesystem. No in-host parallel tests.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON((github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite != 'sharded')) && '["serial"]' || '["default","primary","stock","isolated"]') }}
    timeout-minutes: ${{ matrix.shard == 'serial' && 120 || 60 }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: launchtest
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Cache Solana CLI
        id: solana-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/solana/install
          key: solana-cli-${{ runner.os }}-${{ env.SOLANA_VERSION }}

      - name: Install Solana CLI
        if: steps.solana-cache.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"

      - name: Add Solana CLI to PATH
        run: |
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Cache Meteora program fixtures
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/validator/fixtures
          key: meteora-fixtures-${{ hashFiles('scripts/ci/start-validator.sh') }}

      - name: Start solana-test-validator
        run: |
          solana --version
          scripts/ci/start-validator.sh "$RUNNER_TEMP/validator"

      - name: Run full test suite
        run: node scripts/ci/run-tests.mjs --shard=${{ matrix.shard }}
        env:
          CI_TEST_REPORT_DIR: ${{ runner.temp }}/test-reports

      - name: Save test results and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-reports
          retention-days: 14

      - name: Validator log
        if: failure()
        run: tail -200 "$RUNNER_TEMP/validator/validator.log" || true

  tests:
    # Preserve the existing full-suite check name; missing/cancelled shards must not pass it.
    name: node --test (PostgreSQL + solana-test-validator)
    needs: integration
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every integration shard
        env:
          RESULT: ${{ needs.integration.result }}
        run: test "$RESULT" = success

      # Not required before merge (quick tests are); a failure on main opens an issue so it is fixed immediately.
      - name: Open an issue when the full suite fails on main
        if: failure() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Full test suite failed on main (${GITHUB_SHA::7})" \
            --body "The full suite (PostgreSQL + solana-test-validator) failed after merge. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  build:
    name: next build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
