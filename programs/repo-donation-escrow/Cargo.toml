[package]
name = "repo-donation-escrow"
version = "0.1.0"
description = "repo.ing donation escrow: donations to a GitHub repo, released only to its verified maintainer"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "repo_donation_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.0.2", default-features = false, features = ["token", "token_2022", "token_2022_extensions", "associated_token"] }
solana-instructions-sysvar = "=3.0.1"
solana-sdk-ids = "=3.1.0"

[dev-dependencies]
litesvm = { version = "=0.16.0", features = ["precompiles"] }
solana-account = "4.3.0"
solana-address = "~2.6.1"
solana-clock = "~3.1.1"
solana-instruction = "~3.4.0"
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-signer = "3.0.1"
solana-transaction = "4.1.5"
base64 = "0.21"
