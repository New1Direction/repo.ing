[package]
name = "bundle-vault"
version = "0.1.0"
description = "repo.ing Bundle launches: backer raise, launch vault, vault controls, fee routing"
edition = "2021"
publish = false

# Its own workspace: nothing else in this repository is Rust.
[workspace]

[lib]
crate-type = ["cdylib", "lib"]
name = "bundle_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
solana-instructions-sysvar = "3.0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
